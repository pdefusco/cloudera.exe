---

# Note, the AWS Red Hat marketplace images are RHUI-based, so the CodeReady
# Builder repository identifier is the "-rhui-rpms" variant rather than the
# subscription-manager "-<arch>-rpms" form.
_nvidia_crb_repo_name: "codeready-builder-for-rhel-{{ ansible_facts['distribution_major_version'] }}-rhui-rpms"
_nvidia_epel_rpm: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"

_nvidia_python_packages:
  - python3-setuptools
  - python3-wheel

# DKMS builds the kernel module against the headers of the *running* kernel; a
# mismatch between kernel-devel and ansible_facts['kernel'] is the usual cause
# of a module that silently fails to build.
_nvidia_build_packages:
  - dkms
  - gcc
  - make
  - "kernel-devel-{{ ansible_facts['kernel'] }}"
  - "kernel-headers-{{ ansible_facts['kernel'] }}"

_nvidia_repo_name: "cuda-rhel{{ ansible_facts['distribution_major_version'] }}"
_nvidia_repo_baseurl: "https://developer.download.nvidia.com/compute/cuda/repos/rhel{{ ansible_facts['distribution_major_version'] }}/{{ ansible_facts['architecture'] }}"
_nvidia_repo_gpgkey: "https://developer.download.nvidia.com/compute/cuda/repos/rhel{{ ansible_facts['distribution_major_version'] }}/{{ ansible_facts['architecture'] }}/D42D0685.pub"

# nvidia-driver-cuda provides nvidia-smi and the CUDA userspace driver.
_nvidia_driver_packages:
  - nvidia-driver-cuda

_nvidia_container_toolkit_packages:
  - nvidia-container-toolkit

# $basearch is expanded by DNF itself, so it is deliberately not templated.
_nvidia_container_toolkit_repo_name: "nvidia-container-toolkit"
_nvidia_container_toolkit_repo_baseurl: "https://nvidia.github.io/libnvidia-container/stable/rpm/$basearch"
_nvidia_container_toolkit_repo_gpgkey: "https://nvidia.github.io/libnvidia-container/gpgkey"
