---

# The open-source kernel module flavour supports Turing (RTX 20xx / T4) and
# newer GPUs, which includes the A10G, A100, L4, L40S and H100. For Volta,
# Pascal or Maxwell hardware, override with "kmod-nvidia-latest-dkms".
nvidia_kmod_package: "kmod-nvidia-open-dkms"

# Install the NVIDIA Container Toolkit so container runtimes (containerd,
# CRI-O, Docker) can expose GPUs to workloads.
nvidia_container_toolkit_enabled: true

