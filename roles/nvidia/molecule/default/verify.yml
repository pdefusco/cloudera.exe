---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check NVIDIA kernel-mode drivers
      ansible.builtin.command: dkms status
      register: __kernel
      failed_when: __kernel.rc != 0
      changed_when: false

    - name: Assert the NVIDIA kernel module is installed
      ansible.builtin.assert:
        that:
          - __kernel.stdout is search('nvidia')
          - __kernel.stdout is search('installed')
        fail_msg: >-
          The NVIDIA DKMS kernel module is not installed.
          dkms status reported: {{ __kernel.stdout }}

    - name: Check the nouveau driver is not loaded
      ansible.builtin.command: lsmod
      register: __lsmod
      changed_when: false

    - name: Assert nouveau is not bound to the GPU
      ansible.builtin.assert:
        that:
          - __lsmod.stdout is not search('nouveau')
        fail_msg: The nouveau driver is still loaded and will block the NVIDIA driver.

    - name: Check the NVIDIA System Management Interface
      ansible.builtin.command: nvidia-smi
      register: __smi
      failed_when: __smi.rc != 0
      changed_when: false

    - name: Check the NVIDIA Container Toolkit
      ansible.builtin.command: nvidia-ctk --version
      register: __ctk
      failed_when: __ctk.rc != 0
      changed_when: false
