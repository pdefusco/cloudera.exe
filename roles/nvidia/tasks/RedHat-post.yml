---
# The in-tree nouveau driver claims the GPU before the NVIDIA module can bind
# to it, so it must be blacklisted in the initramfs as well as at runtime.
# The "Regenerate initramfs" handler is declared ahead of "Reboot host" so that
# the rebuilt initramfs is in place before the host restarts.
- name: Blacklist the nouveau kernel module
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    content: |
      blacklist nouveau
      options nouveau modeset=0
    owner: root
    group: root
    mode: "0644"
  notify: Regenerate initramfs

- name: Omit the nouveau driver from the initramfs
  ansible.builtin.lineinfile:
    path: /etc/dracut.conf.d/blacklist-nouveau.conf
    line: 'omit_drivers+=" nouveau "'
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Regenerate initramfs
